<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 230px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    #download-btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background-color: #22c55e;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #download-btn:hover:not(:disabled) {
      background-color: #16a34a;
    }
    #download-btn:disabled {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #94a3b8;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>JioSaavn Grabber</h3>
  <button id="download-btn" disabled>Download Song</button>
  <div id="status">Play a track on JioSaavn first...</div>
  <script src="popup.js"></script>
</body>
</html>
