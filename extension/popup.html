<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }
    .track-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .track-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #download-btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background-color: #22c55e;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #download-btn:hover:not(:disabled) {
      background-color: #16a34a;
    }
    #download-btn:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #94a3b8;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>JioSaavn Downloader</h3>
  
  <div class="track-card">
    <div class="track-title" id="display-title">No track detected</div>
    <div class="track-artist" id="display-artist">Play music on JioSaavn</div>
  </div>

  <button id="download-btn" disabled>Download Track</button>
  <div id="status">Waiting for audio playback...</div>
  
  <script src="popup.js"></script>
</body>
</html>
